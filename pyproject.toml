[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perimeter"
version = "1.0.0"
description = "Терминальный комплекс аудита безопасности: DLP, сканер портов, OSINT, web-аудит, crypto vault, отчёты"
requires-python = ">=3.10"
dependencies = [
    "yara-python",
    "cryptography",
    "httpx",
    "reportlab",
    "python-whois",
    "dnspython",
]

[project.optional-dependencies]
# Активные проверки слабых паролей MySQL/PostgreSQL/MongoDB
db-checks = ["pymongo", "PyMySQL", "psycopg2-binary"]

[project.scripts]
perimeter = "cli:main"

[tool.setuptools]
py-modules = ["cli", "database"]

[tool.setuptools.packages.find]
include = ["core*", "api*"]

# Данные ставятся в <prefix>/share/perimeter/<тот же путь>, см. core/paths.py
[tool.setuptools.data-files]
"share/perimeter/knowledge_base" = ["knowledge_base/vulnerabilities.json"]
"share/perimeter/assets" = ["assets/DejaVuSans.ttf"]
"share/perimeter/core" = ["core/subdomains_wordlist.txt"]
"share/perimeter/core/modules/dlp/rules" = ["core/modules/dlp/rules/*.yar"]
